services:
  - type: web
    name: telegram-session-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DEFAULT_API_ID
        sync: false
      - key: DEFAULT_API_HASH
        sync: false

      - key: READER_API_ID
        sync: false
      - key: READER_API_HASH
        sync: false
